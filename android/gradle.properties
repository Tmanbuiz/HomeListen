org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.workers.max=2
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# opus_flutter_android still declares minSdk 19, which current NDKs reject.
# The app itself targets minSdk 24, so this concerns only the plugin's own
# declaration rather than anything we ship.
android.ndk.suppressMinSdkVersionError=21
