blueprint:
  name: Home Listen - monitoring health warning
  description: >-
    Warn after 45 seconds if the monitor loses its broker connection, or if
    monitoring is on but microphone samples or the sound detector stop arriving.
    Intentionally stopping monitoring does not trigger a failure warning.
    Use this only while sound detection is enabled on the home phone.
  domain: automation
  homeassistant:
    min_version: "2024.10.0"
  input:
    monitoring:
      name: Monitoring entity
      selector:
        entity:
          filter:
            - domain: binary_sensor
              integration: mqtt
    microphone:
      name: Microphone samples entity
      selector:
        entity:
          filter:
            - domain: binary_sensor
              integration: mqtt
    detector:
      name: Sound detector entity
      selector:
        entity:
          filter:
            - domain: binary_sensor
              integration: mqtt
    response:
      name: Warning action
      selector:
        action:
mode: single
trigger_variables:
  monitoring_entity: !input monitoring
  microphone_entity: !input microphone
  detector_entity: !input detector
triggers:
  - trigger: state
    entity_id: !input monitoring
    from: "on"
    to: unavailable
    for: "00:00:45"
  - trigger: template
    value_template: >-
      {{ is_state(monitoring_entity, 'on')
             and (not is_state(microphone_entity, 'on')
                  or not is_state(detector_entity, 'on')) }}
    for: "00:00:45"
actions: !input response
